name: CI

on:
  pull_request:
  # Every branch is validated, not just main: phase work has to be able to
  # prove itself before it is merged anywhere.
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  checks:
    name: Lint, types, tests, Expo export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # The dictionaries must not drift. The typecheck already refuses an
      # English file that is missing a Spanish key -- this covers what a type
      # cannot: blank strings, mismatched placeholders, and every key the app
      # builds at runtime from a status, an actor or an error code.
      - name: Translation parity
        run: npm run test:i18n

      # Proves the app still bundles and that every route in src/app resolves.
      - name: Expo validation
        run: npx expo export --platform web --output-dir dist

      # Phase 10: the export has to carry what a browser needs before it will
      # offer to install the application. A missing manifest is silent -- the
      # app works and the install prompt simply never appears.
      - name: Packaging
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/icons/icon-maskable-512.png
          grep -q '"display": "standalone"' dist/manifest.webmanifest
          grep -q 'rel="manifest"' dist/index.html
          grep -q 'serviceWorker' dist/index.html

  database:
    name: Migrations, seed and database guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots a real Postgres with the Supabase schemas, applies every
      # migration from nothing, and loads the seed.
      - name: Start Supabase
        run: supabase start

      - name: Reset from migrations
        run: supabase db reset

      # The executable version of the promises in docs/DATABASE.md: no double
      # booking, blocks respected, working hours enforced server-side,
      # cancellation releases the slot.
      - name: Booking guarantees
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/booking_guarantees.sql

      # Point 15 of the Definition of Done: one business cannot reach another
      # business's calendar, customers or appointments.
      - name: Tenant isolation
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation.sql

      # Phase 2: the authoritative availability API, including what an
      # anonymous caller may and may not learn from it.
      - name: Availability API
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/availability_api.sql

      # Phase 3: the guest booking path, driven as an anonymous caller.
      - name: Public booking
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/public_booking.sql

      # Phase 4: the appointment lifecycle and who may move it.
      - name: Professional operations
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/professional_operations.sql

      # Phase 5: rescheduling, manual booking, and the audit history of both.
      - name: Appointment lifecycle
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/appointment_lifecycle.sql

      # Phase 6: who counts as the same customer, and the tenant boundary
      # that must never be crossed to answer that question.
      - name: Customer identity
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/customer_identity.sql

      # Phase 8: what the outbox queues, what it refuses to queue twice, and
      # who may read or drain it.
      - name: Notification outbox
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/notification_outbox.sql

      # Phase 9: what the payment domain promises, including that a client
      # never chooses an amount and money outlives nothing it should.
      - name: Payments
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/payments.sql

      # The grant classification: adding a function to public fails this
      # until it is deliberately placed in one of the three groups.
      - name: Function grants
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/function_grants.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # =========================================================================
  # The browser. Everything above proves the pieces; this proves the built
  # application, the router, PostgREST and the screens agree with each other.
  #
  # Hermetic on purpose: a local Supabase stack, the deterministic fixtures and
  # a build pointed at them. No cloud project, no secret, nothing that a fork
  # or a pull request from outside cannot run.
  # =========================================================================
  e2e:
    name: End-to-end in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start Supabase
        run: supabase start

      # The keys a local stack issues are fixed and public; `supabase status`
      # is simply where they are written down. Nothing here is a secret and
      # nothing here reaches a real project. The values arrive quoted, and a
      # quote that survives into GITHUB_ENV becomes part of the URL.
      - name: Collect the local stack's configuration
        run: |
          supabase status --output env \
            | sed -E 's/^([A-Z_]+)="?(.*[^"])"?$/SB_\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Apply migrations and the seed
        run: supabase db reset

      - name: Run the suite
        env:
          E2E_DB_URL: ${{ env.LOCAL_DB_URL }}
          E2E_SUPABASE_URL: ${{ env.SB_API_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
        run: bash tools/e2e/run.sh

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/.results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

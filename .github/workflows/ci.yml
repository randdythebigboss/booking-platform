name: CI

on:
  pull_request:
  # Every branch is validated, not just main: phase work has to be able to
  # prove itself before it is merged anywhere.
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  checks:
    name: Lint, types, tests, Expo export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # Proves the app still bundles and that every route in src/app resolves.
      - name: Expo validation
        run: npx expo export --platform web --output-dir dist

  database:
    name: Migrations, seed and database guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots a real Postgres with the Supabase schemas, applies every
      # migration from nothing, and loads the seed.
      - name: Start Supabase
        run: supabase start

      - name: Reset from migrations
        run: supabase db reset

      # The executable version of the promises in docs/DATABASE.md: no double
      # booking, blocks respected, working hours enforced server-side,
      # cancellation releases the slot.
      - name: Booking guarantees
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/booking_guarantees.sql

      # Point 15 of the Definition of Done: one business cannot reach another
      # business's calendar, customers or appointments.
      - name: Tenant isolation
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation.sql

      # Phase 2: the authoritative availability API, including what an
      # anonymous caller may and may not learn from it.
      - name: Availability API
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/availability_api.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
